[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deputy-mcp"
version = "0.1.0"
description = "Deputize cheap models. Claude stays the sheriff. Claude Code plugin and MCP server where DeepSeek V4.1 Flash (thinking on) reviews Claude's changes for bugs, gives second opinions and can take bulk work, while Claude keeps the judgment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirhossein Alimohammadi" }]
keywords = [
    "claude-code", "claude", "mcp", "mcp-server", "model-context-protocol", "deepseek",
    "deepseek-v4", "deepinfra", "subagent", "ai-agent", "coding-agent", "llm",
    "cost-optimization", "token-savings", "anthropic", "claude-code-plugin", "agentic-coding",
    "code-review", "ai-code-review", "second-opinion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20,<2",
    "openai>=1.40,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deputy = "deputy.cli:main"

[project.urls]
Homepage = "https://github.com/alimohammadiamirhossein/deputy"
Repository = "https://github.com/alimohammadiamirhossein/deputy"
Issues = "https://github.com/alimohammadiamirhossein/deputy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deputy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
