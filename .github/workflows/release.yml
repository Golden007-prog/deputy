name: Release

# Push a tag like v0.2.0 to publish to PyPI and the MCP Registry and create a GitHub release.
# One-time setup: add a trusted publisher on pypi.org (project deputy-cc, workflow release.yml,
# environment pypi). No API tokens are stored in the repo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'EOF'
          import json, sys, tomllib
          tag = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json package": json.load(open("server.json"))["packages"][0]["version"],
              "plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
          }
          bad = {name: version for name, version in found.items() if version != tag}
          if bad:
              sys.exit(f"tag v{tag} does not match: {bad}")
          EOF
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deputy-cc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves the new version
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/deputy-cc/${GITHUB_REF_NAME#v}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI never showed the new version" && exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [") == 1 { found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Deputy $version" --notes-file notes.md
